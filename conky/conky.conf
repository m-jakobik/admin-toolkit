conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=12',
    gap_x = 20,
    gap_y = 10,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_argb_visual = true,
    own_window_argb_value = 120, -- 0-255
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    xinerama_head = 1,
}

conky.text = [[
# Wyświetla godzinę, minuty i sekundy
${alignc}${color white}${font sans-serif:bold:size=30}${time %R}${font}
# Wyświetla pełną nazwę dnia, dzień miesiąca i nazwę miesiąca
${alignc}${color grey}${font sans-serif:bold:size=12}${time %A, %d.%m.%Y}${font}

${color grey}Info:$color ${scroll 30 Conky - $conky_version}  ${color grey}User:${color white}${execi 3600 whoami}
${color grey}Kernel:$color ${scroll 30 $nodename $kernel $machine}
$hr
${color grey}Pogoda:${color white}${font DejaVu Sans Mono:size=12}${execpi 900 ~/Scripts/pogoda_ometeo.sh}${font}${execp cat /tmp/weather_conky}
$hr
${color grey}Uptime:$color $uptime
${color grey}Frequency (in GHz):$color $freq_g
${color grey}RAM Usage:$color $mem/$memmax - $memperc% ${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 4}
${color grey}CPU Usage:$color $cpu% ${cpubar 4}
${color grey}CPU Temp:$color ${execi 7 sensors | grep 'Package id 0:' | awk '{print $4}'}
${color grey}CPU Fan: $color ${execi 5 sensors | grep 'fan1' | awk '{print $2}'} RPM
$hr
${color grey}La Baterija:$color ${battery_percent BAT0}% ${battery_time BAT0}
${color grey}Design Cap: ${color}${execi 600 grep "CHARGE_FULL_DESIGN" /sys/class/power_supply/BAT0/uevent | cut -d= -f2 | awk '{print $1/1000000 " Wh"}'}
${color grey}Current Max: ${color}${execi 600 grep "CHARGE_FULL=" /sys/class/power_supply/BAT0/uevent | cut -d= -f2 | awk '{print $1/1000000 " Wh"}'}
${color grey}Energy Drain: ${color}${execi 2 awk 'BEGIN {FS="="} /VOLTAGE_NOW=/ {v=$2} /CURRENT_NOW=/ {i=$2} END {printf("%.2f W", (v*i)/1000000000000)}' /sys/class/power_supply/BAT0/uevent}
$hr
${color grey}File systems:
 / $color${fs_used /}/${fs_size /} - ${fs_used_perc /}% ${fs_bar 4 /}
	${execpi 600 bash /home/f3t1/Scripts/SSD_health.sh}
 ${color grey}SSD Temp: ${color}\
${if_match ${execi 60 /usr/sbin/smartctl -a /dev/sda | grep -i temp | awk '{print $10}'} > 55}\
${color red}\
${else}\
${color white}\
${endif}\
${execi 60 /usr/sbin/smartctl -a /dev/sda | grep -i temp | awk '{print $10}'} °C
${color}$hr
${color grey}Networkowo:
  ${color grey}Wi-Fi: $color ${wireless_essid wlp1s0} (${wireless_link_qual_perc wlp1s0}%)
  ${color grey}Public IP:$color ${execpi 60 stdbuf -oL ~/Scripts/meine_ip.sh}

${color grey} Up:$color ${upspeed wlp1s0}
${upspeedgraph wlp1s0 40,360 00ff00 ff0000}
${color grey} Down:$color ${downspeed wlp1s0}
${downspeedgraph wlp1s0 40,360 00ff00 ff0000}
$hr
${color gray}NextCloud OCI status: \
${if_match "${execi 600 /home/f3t1/Scripts/check_nc.sh}" == "ONLINE"}\
${color green}ONLINE\
${else}\
${color red}OFFLINE\
${endif}${color}

${color grey}Name              PID     CPU%   MEM%
${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${color lightgrey} ${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${color lightgrey} ${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${color lightgrey} ${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}

${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
]]
